services:
  reverse-proxy:
    image: traefik:v2.11
    depends_on:
      - frontend
      - backend
    command:
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--log.level=INFO"
    ports:
      - "8090:80"
      - "8091:8080" # Traefik dashboard (secure in production)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - .env
    restart: unless-stopped

  backend:
    build:
      context: ./server
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    extra_hosts:
      # host.docker.internal isn't automatic on native Docker Engine (only Docker Desktop
      # provides it for free) -- needed so the backend can reach Ollama running on the WSL host.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./server:/app
      - ./data:/app/data
      - ./secrets:/secrets
      - "${LIBRARY_CURRICULUM_PATH:-./data/ref/curriculum}:/app/library/curriculum"
      - "${LIBRARY_HISTORY_PATH:-./data/ref/history}:/app/library/history"
    depends_on:
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./client
    env_file:
      - .env
    volumes:
      - ./client:/app
      - /app/node_modules
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=4000"
    ports:
      - "4000:4000"
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
